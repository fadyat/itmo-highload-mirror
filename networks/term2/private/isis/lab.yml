name: static_routing

mgmt:
  network: colab-net
  ipv4-subnet: 10.20.30.0/24

topology:
  nodes:
    R1:
      kind: linux
      network-mode: none
      image: frrenv

    R2:
      kind: linux
      network-mode: none
      image: frrenv

    R3:
      kind: linux
      network-mode: none
      image: frrenv

    PC1:
      kind: linux
      network-mode: none
      image: frrenv

    PC2:
      kind: linux
      network-mode: none
      image: frrenv

    PC3:
      kind: linux
      network-mode: none
      image: frrenv

  links:
    - endpoints: ["R1:eth1", "R2:eth1"]
    - endpoints: ["R1:eth2", "R3:eth1"]
    - endpoints: ["R2:eth2", "R3:eth2"]
    - endpoints: ["PC1:eth1", "R1:eth3"]
    - endpoints: ["PC2:eth1", "R2:eth3"]
    - endpoints: ["PC3:eth1", "R3:eth3"]
