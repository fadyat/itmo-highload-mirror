variables:
  GIT_DEPTH: 10
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: normal

grade-containerlab:
  tags:
    - computer-networks
  rules:
    # never run in public repo
    - if: $CI_PROJECT_NAME =~ /^public-(fall|spring)-20\d\d/
      when: never
    # never run on contributing branches
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /contributing/ || $CI_COMMIT_BRANCH =~ /contributing/
      when: never
    # never run on main branches
    - if: $CI_COMMIT_BRANCH =~ /main/
      when: never
    # otherwise run always
    - if: $CI_COMMIT_BRANCH =~ /static_routing|static_routing_backup_link/
    - when: on_success
  script:
    # As all scripts use absolute imports,
    # PYTHONPATH should point to the root of the repository
    - export PYTHONPATH="${CI_PROJECT_DIR}"
    - python3 test_infra/grader/__main__.py
  timeout: 10 minutes
