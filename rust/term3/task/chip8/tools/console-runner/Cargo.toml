[package]
name = "chip8-console-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.87"
chip8 = { path = "../.." }
clap = { version = "4.5.18", features = ["derive"] }
derive_more = { version = "2.0.1", features = ["from"] }
device_query = "4.0.1"
rand = "0.9.2"
ratatui = { version = "0.29.0", features = ["all-widgets", "unstable-widget-ref"] }
