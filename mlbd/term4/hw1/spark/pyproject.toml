[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "N",    # pep8-naming
    "RET",  # flake8-return
    "PIE",  # flake8-pie
    "PERF", # perflint
    "PL",   # pylint
]
ignore = [
    "E501",    # line length handled separately
    "PLR0913", # too many arguments
    "PLR2004", # magic value in comparison
    "N806",    # non-lowercase variable in function (Spark DataFrame names)
    "N812",    # canonical PySpark idiom: `from pyspark.sql import functions as F`
    "RUF001",  # ambiguous unicode (we keep cyrillic literals on purpose)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = []
